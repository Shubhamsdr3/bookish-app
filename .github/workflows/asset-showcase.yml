name: Asset showcase

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - ".github/workflows/asset-showcase.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build showcase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Build hosting bundle
        run: |
          rm -rf hosting
          mkdir -p hosting
          rsync -a --exclude 'env/' assets/ hosting/assets/
          cd hosting
          dart run asset_showcase --assets=assets --output=index.html

      - name: Upload hosting bundle
        uses: actions/upload-artifact@v4
        with:
          name: asset-showcase
          path: hosting/
          if-no-files-found: error
          retention-days: 14
